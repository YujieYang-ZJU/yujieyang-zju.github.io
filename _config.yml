# Personal website settings
title: "Yujie Yang"
description: "Ph.D. Student at Zhejiang University"
url: "https://yujieyang-zju.github.io"
baseurl: ""
repository: "YujieYang-ZJU/yujieyang-zju.github.io"
locale: "en"
timezone: "Asia/Singapore"

# Enable after adding your Google Scholar profile and configuring the crawler.
google_scholar_stats_enabled: false
google_scholar_stats_use_cdn: true
google_analytics_id:
google_site_verification:
bing_site_verification:
baidu_site_verification:

author:
  name: "Yujie Yang"
  avatar: "images/avatar.svg"
  bio: "Ph.D. Student"
  employer: "Zhejiang University"
  location:
  email:
  github: "YujieYang-ZJU"
  googlescholar:
  orcid:
  researchgate:
  linkedin:

include:
  - _pages
  - files
exclude:
  - docs
  - google_scholar_crawler
  - .bundle
  - .github
  - .sass-cache
  - .jekyll-cache
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - run_server.sh
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - vendor
  - node_modules
  - work

encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"
markdown: kramdown
highlighter: rouge
lsi: false
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  entity_output: as_char
  toc_levels: 1..6

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
      author_profile: true

sass:
  sass_dir: _sass
  style: compressed

permalink: /:categories/:title/
plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
